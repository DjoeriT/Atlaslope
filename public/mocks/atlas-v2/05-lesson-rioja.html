<script>window.PAGE={"page": "lesson", "bounds": [[-3.15, 42.05], [-1.65, 42.75]], "pitch": 55, "bearing": -15, "stops": [{"n": "Haro", "zone": "Rioja Alta", "ll": [-2.85, 42.577], "cam": {"zoom": 12, "pitch": 55, "bearing": -20}, "lede": "The hub of Rioja Alta, where the railway made the modern wine trade in the 1880s.", "alt": "About 480 m", "soil": "Clay-calcareous and ferrous clay", "climate": "Atlantic influence: the coolest and wettest end of Rioja", "grapes": "Tempranillo first, Graciano and Mazuelo for backbone", "why": "The Barrio de la Estaci\u00f3n bodegas sit by the tracks because Bordeaux came here for wine when phylloxera hit France. Haro is where Rioja learned to age in oak."}, {"n": "Conchas de Haro", "zone": "Rioja Alta", "ll": [-2.93, 42.63], "cam": {"zoom": 12.4, "pitch": 62, "bearing": -55}, "lede": "The gorge where the Ebro squeezes into Rioja between two mountain walls.", "alt": "About 450 m at the river", "soil": "Limestone cliffs, alluvial floor", "climate": "The door for Atlantic air and rain", "grapes": "None in the gorge itself", "why": "Everything west of here is Atlantic, everything east gets drier. This gap is the reason the three zones differ: it lets the ocean in, but only so far."}, {"n": "Sierra de Cantabria", "zone": "Rioja Alavesa", "ll": [-2.58, 42.63], "cam": {"zoom": 11.6, "pitch": 65, "bearing": 5}, "lede": "The ridge that shields the vineyards from the north.", "alt": "Crest 1,200 to 1,450 m", "soil": "Limestone", "climate": "Blocks north winds and much of the Atlantic rain", "grapes": "Vines stop around 700 m on its south-facing foot", "why": "The sierra is a wall. Clouds pile up on its north side and the vineyards below it bask in a rain shadow. Without it, Alavesa would be too wet for Tempranillo."}, {"n": "Laguardia and Rioja Alavesa", "zone": "Rioja Alavesa", "ll": [-2.585, 42.555], "cam": {"zoom": 12.3, "pitch": 60, "bearing": -10}, "lede": "Basque Rioja: terraces of pale clay under the sierra, small plots, old traditions.", "alt": "500 to 700 m", "soil": "Clay-calcareous, the palest soils in Rioja", "climate": "Continental with the sierra's shelter; cool nights", "grapes": "Tempranillo, often whole-bunch carbonic maceration for young wines", "why": "Altitude plus limestone gives the freshest, most aromatic Tempranillo in Rioja. The region's first ch\u00e2teau-style estate was built in Elciego in 1858."}, {"n": "Logro\u00f1o and the Ebro", "zone": "Rioja Oriental", "ll": [-2.445, 42.465], "cam": {"zoom": 11.8, "pitch": 55, "bearing": 30}, "lede": "The capital on the river, and the hinge between west and east.", "alt": "About 380 m", "soil": "Alluvial terraces of gravel and sand along the river", "climate": "Transitional: Atlantic fades, Mediterranean begins", "grapes": "Tempranillo and Garnacha both at home", "why": "The Ebro runs the length of Rioja and sets its terraces. The newest terraces by the water are the warmest, oldest ones higher up are cooler and poorer, and better."}, {"n": "Rioja Oriental: Calahorra and Alfaro", "zone": "Rioja Oriental", "ll": [-1.9, 42.26], "cam": {"zoom": 11, "pitch": 55, "bearing": -40}, "lede": "The low, warm, dry east where Garnacha rules.", "alt": "300 to 400 m on the plain, 600 m up Monte Yerga", "soil": "Alluvial and ferrous clay", "climate": "Mediterranean: hottest, driest, least rain of the three", "grapes": "Garnacha, Tempranillo riper and fuller", "why": "Once called Rioja Baja and dismissed as bulk country, now where the higher slopes of Monte Yerga give old-vine Garnacha of real class."}, {"n": "Sierra de la Demanda and the Najerilla", "zone": "Rioja Alta", "ll": [-2.78, 42.3], "cam": {"zoom": 11.3, "pitch": 62, "bearing": 175}, "lede": "The southern wall and the high side valleys of Rioja Alta.", "alt": "Vineyards to 800 m; peaks above 2,000 m", "soil": "Ferrous clay and clay-calcareous", "climate": "Cool, late ripening, snow on the peaks into spring", "grapes": "Garnacha in the Najerilla valley, Tempranillo lower down", "why": "The Demanda closes Rioja to the south. Its valleys, Najerilla and Oja, are the coolest vineyards in Rioja Alta and the source of its most structured wines."}]};</script>

</body></html><script>(function(){const S=PAGE.stops,N=S.length,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let i=Math.max(0,Math.min(N,parseInt((location.hash.match(/stop=(\d+)/)||[])[1]||1)-1));const marks=[];
const el=id=>document.getElementById(id);
function render(fly){const fin=i>=N;el('finale').hidden=!fin;el('stop-facts').hidden=fin;el('stop-lede').hidden=fin;el('start-quiz').hidden=!fin;el('replay').hidden=!fin;el('next').hidden=fin;el('prev').hidden=fin;
 el('lesson-kicker').textContent=fin?'Rioja lesson · Done':'Rioja lesson · Stop '+(i+1)+' of '+N;el('lesson-dots').setAttribute('aria-label',fin?'Lesson done':'Stop '+(i+1)+' of '+N);
 el('lesson-dots').innerHTML=S.map((_,k)=>'<i class="'+(k<i?'ok':k===i&&!fin?'cur':'')+'"></i>').join('');
 el('prev').disabled=i===0;el('next').textContent=i===N-1?'Finish lesson':'Next stop';
 if(fin){el('stop-title').textContent='Now find them';el('recap').innerHTML=S.map((s,k)=>'<li><button class="linkish" data-k="'+k+'"><b>'+(k+1)+'</b>'+s.n+'<span>'+s.zone+'</span></button></li>').join('');el('recap').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{i=+b.dataset.k;render(true);}));if(window.paraje)paraje.selectZone(null);if(fly)map.flyTo({center:[-2.4,42.42],zoom:9.6,pitch:45,bearing:-15,duration:RM?0:2200,padding:paddingFor()});}
 else{const s=S[i];el('stop-title').textContent=s.n;el('stop-lede').textContent=s.lede;
  el('stop-facts').innerHTML='<dt>Zone</dt><dd>'+s.zone+'</dd><dt>Altitude</dt><dd>'+s.alt+'</dd><dt>Soil</dt><dd>'+s.soil+'</dd><dt>Climate</dt><dd>'+s.climate+'</dd><dt>Grapes</dt><dd>'+s.grapes+'</dd><dt class="sr-only">Why it matters</dt><dd class="why">'+s.why+'</dd>';
  if(window.paraje&&document.body.dataset.ready)paraje.selectZone(s.zone);
  if(fly)map.flyTo(Object.assign({center:s.ll,duration:RM?0:2600,essential:true,padding:paddingFor()},s.cam));}
 marks.forEach((m,k)=>{m.className='stopnum'+(k===i&&!fin?' cur':k<i||fin?' done':'');m.setAttribute('aria-current',k===i&&!fin?'step':'false');});
 history.replaceState(null,'','#stop='+(i+1));}
function paddingFor(){const rem=parseFloat(getComputedStyle(document.documentElement).fontSize),c=document.querySelector('.card').getBoundingClientRect();return innerWidth>820?{left:c.right+rem,top:rem*4.6,bottom:rem*1.5,right:rem*5}:{left:rem,top:rem*4.6,bottom:innerHeight*0.52+rem,right:rem*4};}
el('next').addEventListener('click',()=>{i=Math.min(N,i+1);render(true);});el('prev').addEventListener('click',()=>{i=Math.max(0,i-1);render(true);});el('replay').addEventListener('click',()=>{i=0;render(true);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'&&i<N){i++;render(true);}if(e.key==='ArrowLeft'&&i>0){i--;render(true);}});
const ready=setInterval(()=>{if(!document.body.dataset.ready)return;clearInterval(ready);
 S.forEach((s,k)=>{const w=document.createElement('div');w.className='stopwrap';const b=document.createElement('button');b.className='stopnum';b.textContent=k+1;b.setAttribute('aria-label','Stop '+(k+1)+': '+s.n);b.addEventListener('click',()=>{i=k;render(true);});w.appendChild(b);new maplibregl.Marker({element:w,anchor:'bottom',offset:[0,-2]}).setLngLat(s.ll).addTo(map);marks.push(b);});
 render(true);},150);
})();</script>
