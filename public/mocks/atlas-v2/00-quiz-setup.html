<!doctype html><html lang="en" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paraje · New quiz</title><link rel="stylesheet" href="assets/maplibre-gl.css"><link rel="stylesheet" href="assets/app.css"></head><body>
<div id="map" role="application" aria-label="Map of Spain. Click a DO to select it."></div>
<section class="card glass" aria-label="Paraje · New quiz"><div class="body"><div class="kicker">New quiz</div><h1>Quiz me on…</h1>
<h3>Area</h3><div class="chips" role="radiogroup" aria-label="Area"><button class="chip" role="radio" aria-checked="true">All of Spain</button><button class="chip" role="radio" aria-checked="false">Green Spain</button><button class="chip" role="radio" aria-checked="false">Ebro Valley</button><button class="chip" role="radio" aria-checked="false">Duero Valley</button><button class="chip" role="radio" aria-checked="false">Mediterranean</button><button class="chip" role="radio" aria-checked="false">Central Plateau</button><button class="chip" role="radio" aria-checked="false">Andalusia</button><button class="chip" role="radio" aria-checked="false">Islands</button><button class="chip" role="radio" aria-checked="false">Rioja (3 zones)</button></div>
<h3>Question types</h3><div class="chips" role="group" aria-label="Question types"><button class="chip multi" role="checkbox" aria-checked="true">Find it on the map</button><button class="chip multi" role="checkbox" aria-checked="true">What is this?</button><button class="chip multi" role="checkbox" aria-checked="true">Region, climate or soil</button></div>
<h3>How many questions</h3><div class="chips" role="radiogroup" aria-label="How many questions"><button class="chip" role="radio" aria-checked="true">10</button><button class="chip" role="radio" aria-checked="false">20</button></div>
<p class="note">The map highlights the area you pick.</p></div>
<div class="foot"><a class="btn primary" href="03-quiz-find.html" id="start">Start quiz</a><a class="btn" href="03-quiz-find.html" id="retry">Retry missed (3)</a></div></section>
<div class="topleft"><a class="brand glass" href="index.html"><b>Paraje</b><small>New quiz</small></a>

<div class="topright"><span class="mock glass">mock · DO boundaries © MAPA 2014</span><nav class="seg glass" aria-label="Mode"><a href="../../" >Explore</a><a href="00-quiz-setup.html" aria-current="page">Quiz</a></nav>
<button id="layers-btn" class="iconbtn glass" aria-label="Layers and base map" aria-expanded="false" aria-controls="layers-menu"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></button>
<button id="theme" class="iconbtn glass" aria-label="Dark interface" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button></div>

</body></html><script>const AREA={"All of Spain":()=>true,"Green Spain":p=>p.macro==='green',"Ebro Valley":p=>p.macro==='ebro',"Duero Valley":p=>p.macro==='duero',"Mediterranean":p=>p.macro==='med',"Central Plateau":p=>p.macro==='meseta',"Andalusia":p=>p.macro==='andalusia',"Islands":p=>p.macro==='islands',"Rioja (3 zones)":p=>p.name==='Rioja'};
const applyArea=()=>{const on=document.querySelector('[aria-label=Area] [aria-checked=true]');if(on&&window.paraje&&map.isStyleLoaded())paraje.dimExcept(AREA[on.textContent]||(()=>true));};
document.querySelectorAll('[role=radiogroup]').forEach(g=>g.querySelectorAll('[role=radio]').forEach(c=>c.addEventListener('click',()=>{g.querySelectorAll('[role=radio]').forEach(x=>x.setAttribute('aria-checked',String(x===c)));applyArea();})));
const want=decodeURIComponent((location.hash.match(/area=([^&]+)/)||[])[1]||'');if(want){document.querySelectorAll('[aria-label=Area] [role=radio]').forEach(x=>x.setAttribute('aria-checked',String(x.textContent===want)));}
const waitReady=setInterval(()=>{if(document.body.dataset.ready){clearInterval(waitReady);applyArea();}},200);
const types=document.querySelectorAll('[role=checkbox]');types.forEach(c=>c.addEventListener('click',()=>{c.setAttribute('aria-checked',String(c.getAttribute('aria-checked')!=='true'));const any=[...types].some(x=>x.getAttribute('aria-checked')==='true');const s=document.getElementById('start');s.toggleAttribute('disabled',!any);s.textContent=any?'Start quiz':'Pick at least one question type';}));</script>
