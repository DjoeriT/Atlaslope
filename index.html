<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Atlaslope</title>
    <style>
      @font-face { font-family: Newsreader; src: url('./fonts/newsreader-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
      @font-face { font-family: 'IBM Plex Sans'; src: url('./fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      :root { color-scheme: light dark; --bg: #f4f1ea; --ink: #1f2420; --muted: #5b625c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141815; --ink: #ecebe6; --muted: #a4aaa5; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
             font: 400 1.0625rem/1.5 'IBM Plex Sans', system-ui, sans-serif; padding: 0 16px; }
      h1 { font: 600 2.75rem/1.1 Newsreader, Georgia, serif; margin: 0 0 .5rem; }
      p { margin: 0; color: var(--muted); max-width: 32rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Atlaslope</h1>
      <p>The wine atlas that quizzes you. A new version is being built; this page will become the atlas.</p>
    </main>
  </body>
</html>
