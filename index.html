<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AtlaSlope · The wine atlas that quizzes you</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      @font-face { font-family: Newsreader; src: url('./fonts/newsreader-latin-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: Newsreader; src: url('./fonts/newsreader-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
      @font-face { font-family: 'IBM Plex Sans'; src: url('./fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'IBM Plex Sans'; src: url('./fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'IBM Plex Sans'; src: url('./fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    </style>
    <script>
      // Set the theme before the first paint so there is no flash: the saved pick, otherwise the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('atlaslope-theme'); } catch (e) {}
        if (t !== 'paper' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AtlaSlope needs JavaScript to draw the map.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
