# Fetches the URLs in Tools/data/fetch-list.tsv for hosts the cloud threads cannot reach (Spanish regional
# government sites, IGN's and MAPA's map services, eAmbrosia's API), and commits the results to the same branch.
# PDFs are kept as text only. Runs when a claude/ branch changes the list.
name: data-fetch
on:
  push:
    branches: ['claude/**']
    paths: ['Tools/data/fetch-list.tsv']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-fetch-${{ github.ref }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 Tools/data/remote_fetch.py Tools/data/fetch-list.tsv Review/sources/fetched
      - name: Commit the results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Review/sources/fetched
          git diff --cached --quiet && exit 0
          git commit -q -m "Data fetch: results of run ${{ github.run_id }}"
          git pull -q --no-rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
