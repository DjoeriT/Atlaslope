# Fetches the URLs in Tools/data/fetch-list.tsv for hosts the cloud threads cannot reach (Spanish regional
# government sites, IGN's and MAPA's map services, eAmbrosia's API), and commits the results to the same branch.
# PDFs are kept as text only. Runs when a claude/ branch changes the list.
name: data-fetch
on:
  push:
    branches: ['claude/**']
    paths: ['Tools/data/fetch-list.tsv']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-fetch-${{ github.ref }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Show the certificate chain of hosts that failed TLS (diagnostic, no secrets)
        run: |
          for h in www.mapa.gob.es mapa.gob.es; do echo "== $h"; timeout 20 openssl s_client -showcerts -servername $h -connect $h:443 </dev/null 2>&1 | grep -E '^ *[0-9] s:|^ *i:|Verify return' || true; done
      - run: python3 Tools/data/remote_fetch.py Tools/data/fetch-list.tsv Review/sources/fetched
      - name: Commit the results to this branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Review/sources/fetched
          git diff --cached --quiet && exit 0
          git commit -q -m "Data fetch: results of run ${{ github.run_id }}"
          git pull -q --no-rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
