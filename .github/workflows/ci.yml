name: checks
on:
  push:
    branches: [main]
  pull_request:
# A newer commit on the same branch or PR cancels the older run (release 4: four pushes, four full runs before one merge).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Docs-only changes (docs/, Review/, .claude/, top-level .md files) skip the build and tests; the jobs still report, so the PR can merge.
  # Anything else runs everything; publish.yml reuses a green run for the same files, or runs the checks itself. Owner's yes, 16 Oct 20:17Z.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs only?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files=$(git diff --no-renames --name-only "$BASE...$HEAD" 2>/dev/null) || { echo "docs=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|Review/|\.claude/)|^[^/]+\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"; echo "Docs only: skipping the build and tests."
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
  # Typecheck, unit tests, data ledger, production build and size: everything in Tools/check.sh except the UI tests.
  check:
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tools/check.sh
        run: Tools/check.sh
  # The UI tests are about 90% of the run, so they run in four parts at once (owner card, 18 Oct 2026: one serial job took 4.2 minutes; two halves still took 3.7).
  # publish.yml looks these steps up by name to reuse a green run; keep the name.
  ui:
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Issue #218 (22 Oct 2026, PR #210): a slow apt mirror stalled this install for ~12 of the job's 15 minutes. The browser is cached
      # per Playwright version; the system packages still come from apt, capped at 5 minutes so a stall fails fast and can be re-run.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      # Second stall on 22 Oct 2026 (PR #219, ui 2/4 hit the 5-minute cap): the runner image already ships Chrome's libraries, and
      # no UI test compares screenshots, so apt runs only when the browser lacks a library.
      - name: Install Chromium system packages
        timeout-minutes: 5
        run: |
          bin=$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name chrome \) | head -1)
          missing=$(ldd "$bin" | grep -c "not found" || true)
          if [ "$missing" = "0" ]; then echo "all libraries present ($bin); apt skipped"; else npx playwright install-deps chromium; fi
      - name: UI tests
        run: npx playwright test --shard=${{ matrix.shard }} --reporter=line
  # The one required check on main (owner, 20 Oct 2026): fails when any part above failed or was cancelled, passes when a docs-only PR
  # skipped them. Branch protection cannot require the four "ui (n/4)" checks by name: a docs-only PR reports one skipped "ui" instead.
  gate:
    name: all checks
    needs: [scope, check, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every part passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if printf '%s\n' $RESULTS | grep -qvE '^(success|skipped)$'; then exit 1; fi
