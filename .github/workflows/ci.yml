name: checks
on:
  push:
    branches: [main]
  pull_request:
# A newer commit on the same branch or PR cancels the older run (release 4: four pushes, four full runs before one merge).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Docs-only changes (docs/, Review/, top-level .md files) skip the build and tests; the jobs still report, so the PR can merge.
  # Anything else runs everything; publish.yml reuses a green run for the same files, or runs the checks itself. Owner's yes, 16 Oct 20:17Z.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs only?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files=$(git diff --no-renames --name-only "$BASE...$HEAD" 2>/dev/null) || { echo "docs=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|Review/)|^[^/]+\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"; echo "Docs only: skipping the build and tests."
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
  # Typecheck, unit tests, data ledger, production build and size: everything in Tools/check.sh except the UI tests.
  check:
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tools/check.sh
        run: Tools/check.sh
  # The UI tests are about 90% of the run, so they run in two halves at once (owner card, 18 Oct 2026: one serial job took 4.2 minutes).
  # publish.yml looks these steps up by name to reuse a green run; keep the name.
  ui:
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: UI tests
        run: npx playwright test --shard=${{ matrix.shard }} --reporter=line
