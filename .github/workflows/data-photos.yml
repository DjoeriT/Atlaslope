# Photo candidates from Wikimedia Commons (Tools/data/photo_candidates.py), committed to the same branch.
# Runs when a claude/ branch changes the script; Commons throttles the cloud container too hard to run it there.
name: data-photos
on:
  push:
    branches: ['claude/**']
    paths: ['Tools/data/photo_candidates.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-photos-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q shapely pillow
      - run: sudo apt-get install -y -q fonts-dejavu-core
      - run: /tmp/venv/bin/python -I Tools/data/photo_candidates.py
      - name: Commit the results to this branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Review/sources/photo-candidates.json Review/sources/contact-sheets 2>/dev/null || git add Review/sources/photo-candidates.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Photo candidates: results of run ${{ github.run_id }}"
          git pull -q --no-rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
