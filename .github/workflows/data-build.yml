# Builds the GDAL-made data files (Tools/data/remote_build.sh) and commits them to the same branch.
# Runs when a claude/ branch changes the build script.
name: data-build
on:
  push:
    branches: ['claude/**']
    paths: ['Tools/data/remote_build.sh']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-build-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal unzip >/dev/null
      - run: Tools/data/remote_build.sh
      - name: Commit the results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/natural-earth-spain.geojson data/koppen-spain.geojson data/added-boundaries.geojson
          cp data/raw/build/munis-report.json Review/sources/added-municipalities-matched.json && git add Review/sources/added-municipalities-matched.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Data build: results of run ${{ github.run_id }}"
          git pull -q --no-rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
