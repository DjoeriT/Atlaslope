# Builds the GDAL-made data files (Tools/data/remote_build.sh) and commits them to the same branch.
# Runs when a claude/ branch changes the build script.
name: data-build
on:
  push:
    branches: ['claude/**']
    paths: ['Tools/data/remote_build.sh']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-build-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal unzip >/dev/null
      - run: Tools/data/remote_build.sh
      # Only a run that finished commits: a cancelled photo run pushed lisboa-2 as 0 bytes (23 Oct 2026).
      - name: Commit the results to this branch
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/natural-earth-spain.geojson data/koppen-spain.geojson data/added-boundaries.geojson
          cp "${ATLASLOPE_RAW:-$HOME/Developer/Atlaslope-raw}/build/munis-report.json" Review/sources/added-municipalities-matched.json && git add Review/sources/added-municipalities-matched.json
          git diff --cached --quiet && exit 0
          # Never commit boundaries that lose a place: on PR #229 this run rebuilt added-boundaries.geojson from older inputs (23 Oct 2026).
          python3 -c "import json,subprocess,sys; old={f['properties'].get('id') for f in json.loads(subprocess.run(['git','show','HEAD:data/added-boundaries.geojson'],capture_output=True,text=True).stdout)['features']}; new={f['properties'].get('id') for f in json.load(open('data/added-boundaries.geojson'))['features']}; lost=sorted(map(str,old-new)); print('lost:', lost) if lost else None; sys.exit(1 if lost else 0)"
          git commit -q -m "Data build: results of run ${{ github.run_id }}"
          git pull -q --no-rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
