name: deploy
# Publishes to GitHub Pages only when LeadBot pushes a release-N tag, which happens only after the owner says "publish release N".
on:
  push:
    tags: ['release-*']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Esri close-in imagery key (owner's free ArcGIS developer account, repo secret). Empty means Sentinel-2 only.
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
