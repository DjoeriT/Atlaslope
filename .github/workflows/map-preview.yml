name: map-preview
# Screenshots of the map close in, on the real network, for mocks and design checks (the cloud container cannot reach the
# tile hosts). Runs on a push to a claude/ branch that changes the map, or by hand. Commits the pictures to
# Review/mock-zoom-detail/shots/ on the same branch: "new" from this branch, "live" from atlaslope.com for comparison.
on:
  push:
    branches: ['claude/**']
    paths: ['src/map/**', 'public/glyphs/**', 'Tools/preview/**', '.github/workflows/map-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        env:
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
        run: npm run build
      - name: TEMP experiment
        env:
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
        run: |
          set +e
          npx vite preview --port 4174 --strictPort &
          for v in plain tile256 nonames both; do
            case $v in tile256) export VITE_DEBUG_TILE256=1 VITE_DEBUG_NONAMES=;; nonames) export VITE_DEBUG_TILE256= VITE_DEBUG_NONAMES=1;; both) export VITE_DEBUG_TILE256=1 VITE_DEBUG_NONAMES=1;; *) export VITE_DEBUG_TILE256= VITE_DEBUG_NONAMES=;; esac
            npm run build >/dev/null 2>&1
            for i in $(seq 30); do curl -sf http://localhost:4174/ >/dev/null && break; sleep 1; done
            ONLY=haro-z14 node Tools/preview/map_shots.mjs http://localhost:4174/ Review/mock-zoom-detail/exp $v
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Review/mock-zoom-detail/exp && git commit -m "TEMP experiment shots [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
          exit 0
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node Tools/preview/map_shots.mjs http://localhost:4173/ Review/mock-zoom-detail/shots new
          node Tools/preview/map_shots.mjs https://atlaslope.com/ Review/mock-zoom-detail/shots live
      - name: Commit the pictures to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Review/mock-zoom-detail/shots
          git diff --cached --quiet && exit 0
          git commit -m "Map preview shots for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
