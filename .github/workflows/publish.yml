name: publish
# Started by hand (Actions › publish › Run workflow) or by the thread after the owner's words "publish release N".
# Re-runs every check on the commit (or reuses the green checks run on main for that exact commit), deploys that commit to GitHub Pages, then creates the release-N tag on it.
# The tag is created last, only after the deploy succeeded, so a failed run leaves no tag behind and N can be retried.
# A tag pushed with the workflow token does not start deploy.yml, so the site is deployed once.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release number N (creates tag release-N)'
        required: true
        type: string
      commit:
        description: 'Full commit hash on main to publish'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    # Only the copy of this workflow on main may publish (a run started from another branch would run that branch's checks).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate inputs
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "publish started by $ACTOR for release-$RELEASE on $COMMIT"
          [[ "$RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "release must be a positive number"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full 40-character hash"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Commit is on main, tag is new and next in line
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "$COMMIT is not on main"; exit 1; }
          if git rev-parse -q --verify "refs/tags/release-$RELEASE" >/dev/null; then echo "release-$RELEASE already exists"; exit 1; fi
          last=$(git tag -l 'release-*' | sed 's/release-//' | sort -n | tail -1)
          [ "$RELEASE" -eq $(( ${last:-0} + 1 )) ] || { echo "next release is $(( ${last:-0} + 1 )), not $RELEASE"; exit 1; }
      # The full suite already ran on these exact files, in the PR (when the merge changed nothing) or on main (ci.yml, push event). Reuse that run when its
      # full checks succeeded (a docs-only run skips them, so it does not count); wait up to 8 minutes if it is still running.
      # Anything else (no run, failed, cancelled, docs-only) runs the checks here. Owner card, 17 Oct 2026: the suite ran three times per release.
      - name: Main already passed on this commit?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
        run: |
          # passed SHA EVENT: true when the newest ci.yml run for SHA and EVENT finished with the full checks green; waits up to 8 minutes.
          passed() {
            for i in $(seq 1 16); do
              run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=$2&per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion)"' 2>/dev/null) || run=""
              read -r id status conclusion <<<"$run"
              [ -n "${id:-}" ] && [ "$id" != "null" ] || { echo "no $2 checks run for $1"; return 1; }
              [ "$status" = "completed" ] && break
              echo "checks run $id is $status; waiting"; if [ "$i" -lt 16 ]; then sleep 30; fi
            done
            [ "${status:-}" = "completed" ] && [ "${conclusion:-}" = "success" ] || return 1
            # Full checks ran: the old single "Tools/check.sh ui" step, or "Tools/check.sh" plus all four "UI tests" parts (a docs-only run skips them all).
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[].steps[]] as $s | ([$s[] | select(.name == "Tools/check.sh ui" and .conclusion == "success")] | length > 0)
              or (([$s[] | select(.name == "Tools/check.sh" and .conclusion == "success")] | length > 0)
                and ([$s[] | select(.name == "UI tests" and .conclusion == "success")] | length) >= 4)' 2>/dev/null) || ok=""
            [ "$ok" = "true" ] && echo "Reusing checks run $id: the full checks passed on $1 ($2)."
          }
          # A merge commit with exactly the files of its PR head was already tested by the PR's run, so don't wait for main's
          # (owner card, 18 Oct 2026: main's run held every publish about 6 minutes). A PR that was behind main has a different tree and falls through.
          if head=$(git rev-parse -q --verify "$COMMIT^2") && [ "$(git rev-parse "$COMMIT^{tree}")" = "$(git rev-parse "$head^{tree}")" ] && passed "$head" pull_request; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if passed "$COMMIT" push; then echo "reuse=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "reuse=false" >> "$GITHUB_OUTPUT"; echo "Running the checks here."
      - uses: actions/setup-node@v7
        if: steps.reuse.outputs.reuse != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.reuse.outputs.reuse != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.reuse.outputs.reuse != 'true'
      - run: Tools/check.sh ui
        if: steps.reuse.outputs.reuse != 'true'
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Esri imagery key (owner's free ArcGIS account, repo secret). Empty until release 3.
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Create release-N
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "release-$RELEASE" "$COMMIT" -m "Release $RELEASE (publish workflow, started by $ACTOR)"
          git push origin "refs/tags/release-$RELEASE"
