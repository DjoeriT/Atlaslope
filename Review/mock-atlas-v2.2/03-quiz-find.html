</body></html><script>const c=document.getElementById('confirm'),b=document.getElementById('status'),fb=document.getElementById('fb');let done=false,pick=null;
const dl=document.getElementById('donames');GEO.dos.features.forEach(f=>{const o=document.createElement('option');o.value=f.properties.name;dl.appendChild(o);});
const ti=document.querySelector('#typein input');ti.addEventListener('change',()=>{const f=GEO.dos.features.find(f=>f.properties.name.toLowerCase()===ti.value.trim().toLowerCase());if(f){paraje.select(f.id);document.dispatchEvent(new CustomEvent('do-pick',{detail:{id:f.id,name:f.properties.name,level:f.properties.level,macro:f.properties.macro}}));}});
document.getElementById('typein').addEventListener('submit',e=>{e.preventDefault();ti.dispatchEvent(new Event('change'));if(!c.disabled)c.click();});
document.addEventListener('do-pick',e=>{if(done)return;pick=e.detail;c.disabled=false;b.textContent='You picked a DO in the '+GEO.macro[e.detail.macro].name+'. Press Confirm, or tap another.';});
c.addEventListener('click',()=>{if(done){location.href='03b-quiz-choices.html';return;}done=true;fb.hidden=false;const ok=pick&&pick.name==='Ribera del Duero';fb.classList.toggle('bad',!ok);fb.querySelector('b').textContent=ok?'✓':'✗';if(!ok){fb.querySelector('span').textContent='Not quite, you picked '+pick.name+'. Ribera del Duero is on the high Duero plateau, east of Valladolid.';const f=GEO.dos.features.find(f=>f.properties.name==='Ribera del Duero');paraje.select(f.id);}b.textContent=ok?'Right':'Not quite';c.textContent='Next question';document.getElementById('skip').hidden=true;document.getElementById('typein').hidden=true;});</script>
