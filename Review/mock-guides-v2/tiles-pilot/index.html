<!doctype html>
<meta charset="utf-8">
<title>Region tiles, pilot</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; color: #111; font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  h2 { font-size: 16px; margin: 32px 0 8px; }
  .pair { display: flex; gap: 16px; }
  figure { margin: 0; width: 600px; }
  img { width: 600px; display: block; border-radius: 6px; }
  figcaption { font-size: 13px; color: #555; margin-top: 4px; }
</style>
<h1>Region tiles: old and new (pilot, 2 of 10)</h1>
<h2>Rioja</h2>
<div class="pair">
  <figure><img src="../tiles/rioja.webp" alt="Old Rioja tile"><figcaption>Old</figcaption></figure>
  <figure><img src="rioja.webp" alt="New Rioja tile"><figcaption>New</figcaption></figure>
</div>
<h2>Andalucía</h2>
<div class="pair">
  <figure><img src="../tiles/andalucia.webp" alt="Old Andalucía tile"><figcaption>Old</figcaption></figure>
  <figure><img src="andalucia.webp" alt="New Andalucía tile"><figcaption>New</figcaption></figure>
</div>
